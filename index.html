    <button class="small" id="btnMap" type="button">지도</button>

    <button class="small" id="btnBag" type="button">가방<span class="bagbadge" id="bagBadge" hidden></span></button>

  <span class="buffs" id="hudBuffs" hidden></span>
</div>
<!-- 12차: 사냥 목표판(목표 + 이번 사냥 기록) 바로 아래 알림 줄. 둘 다 누름이 아래로 통과(조이스틱) -->

<div class="screen" id="rotate"><p>폰을 가로로 돌려 주세요</p></div>

<script src="vendor/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
<script>
(() => {
  "use strict";
  try {
    if (!(isSecureContext && "serviceWorker" in navigator &&
        (location.hostname.endsWith("github.io") || location.hostname === "localhost" ||
         location.hostname === "127.0.0.1"))) return;

    const PREPARING = "오프라인 준비 중…";
    const UNAVAILABLE = "오프라인 준비 안 됨 — 인터넷 연결 후 다시 열어 주세요";
    let registration = null;
    let hadController = !!navigator.serviceWorker.controller;
    let lastUpdate = -Infinity;
    let applying = false;
    let checking = false;
    let reloading = false;
    // 2026-10-17 대표님: 게임 중에 새 버전을 받으면 [지금 업데이트]로 바로 바꾸기.
    // 게임(main.js)은 이 상태를 읽고 'hw-update' 알림을 받는다. state: none | ready | applying
    // 수동 교체 대상 {worker, version}: 이 워커가 실제로 controller가 된 것을 확인한 뒤에만 새로고침한다(⑦)
    let target = null;
    // 시작 화면 자동 교체 뒤 버전 확인이 늦으면 주기 작업에서 다시 확인한다(⑦)
    let autoTarget = null;
    // 13차: current = 지금 쓰는 버전, check() = [업데이트 확인] 버튼(바로 새 버전 찾기)
    const api = window.__hwUpdate = { state: "none", version: "", current: "", apply: manualApply, check: checkNow };
    function setState(state, version) {
      if (api.state === state && api.version === version) return;
      api.state = state; api.version = version;
      try { window.dispatchEvent(new CustomEvent("hw-update", {detail: {state, version}})); } catch (_) {}
    }
    // 게임을 시작하기 전(불러오는 중·시작 화면)만 새로고침해도 안전하다
    const safe = () => !!(window.__hw && !window.__hw.started);

    function show(text) {
      try {
        const panel = document.querySelector("#title .title-box");
        if (!panel) return;
        let state = document.getElementById("offlineState");
        if (!state) {
          state = document.createElement("div");
          state.id = "offlineState";
          state.style.fontSize = "13px";
          state.style.color = "#a99f88";
          state.style.margin = "0";
          state.setAttribute("role", "status");
          panel.appendChild(state);
        }
        state.textContent = text;
      } catch (_) {}
    }

    function message(worker, command) {
      return new Promise((resolve, reject) => {
        let channel;
        let timer;
        const finish = (error, data) => {
          clearTimeout(timer);
          if (channel) { channel.port1.close(); channel.port2.close(); }
          if (error) reject(error); else resolve(data);
        };
        try {
          if (!worker) throw new Error("서비스 워커 없음");
          channel = new MessageChannel();
          timer = setTimeout(() => finish(new Error("서비스 워커 응답 시간 초과")), 5000);
          channel.port1.onmessage = event => finish(null, event.data);
          channel.port1.onmessageerror = () => finish(new Error("서비스 워커 응답 오류"));
          worker.postMessage(command, [channel.port2]);
        } catch (error) { finish(error); }
      });
    }

    async function status() {
      if (checking) return;
      checking = true;
      try {
        const worker = navigator.serviceWorker.controller || (registration && registration.active);
        if (!worker) {
          show(!registration || registration.installing ? PREPARING : UNAVAILABLE);
          return;
        }
        const data = await message(worker, "status");
        if (worker !== (navigator.serviceWorker.controller || (registration && registration.active))) return;
        if (data.ready && data.version) api.current = data.version;
        let text = data.ready ? "오프라인 준비 완료 · v" + data.version.slice(0, 6) : UNAVAILABLE;
        // 이미 설치된 앱이 새 버전을 받는 중이면 기다리면 된다는 것을 알려 준다(받기가 끝나거나 실패하면 이 문구는 사라짐)
        if (registration && registration.installing && navigator.serviceWorker.controller) {
          text = "새 버전 받는 중… 다 받으면 자동으로 바뀝니다 (게임을 시작했다면 메뉴 → [지금 업데이트])";
        }
        show(text);
      } catch (_) { show(UNAVAILABLE); }
      finally { checking = false; }
    }

    function lockStart(on) {
      try {
        for (const id of ["btnContinue", "btnNew", "btnNewYes"]) {
          const el = document.getElementById(id);
          if (el) el.disabled = on;
        }
        if (on) show("새 버전으로 바꾸는 중…");
      } catch (_) {}
    }

    async function applyWaiting() {
      if (applying || reloading || !registration || !registration.waiting || !safe()) return;
      applying = true;
      try {
        const worker = registration.waiting;
        const data = await message(worker, "status");
        if (data.ready && worker === registration.waiting && safe()) {
          // 교체하는 동안 게임을 시작하지 못하게 시작 버튼을 잠근다(적용되면 곧 새로고침)
          lockStart(true);
          const result = await message(worker, "apply");
          if (!result || !result.applied) lockStart(false);
          else setTimeout(() => { if (!reloading && !autoTarget) lockStart(false); }, 10000);
        }
      } catch (_) { lockStart(false); }
      finally { applying = false; }
    }

    // 게임 중(시작 화면이 아님)에 기다리는 새 버전이 다 받아졌는지 확인해 게임에 알린다
    async function checkWaiting() {
      if (api.state === "applying" || reloading) return;
      const worker = registration && registration.waiting;
      if (!worker || safe()) { setState("none", ""); return; }
      try {
        const data = await message(worker, "status");
        if (worker !== registration.waiting || api.state === "applying") return;
        setState(data.ready ? "ready" : "none", data.ready ? data.version : "");
      } catch (_) {}
    }

    // 수동 교체 마무리: controller가 요청한 그 워커가 됐을 때만. 거래 저장 대기 중이면 다음에 다시(주기 작업).
    // 게임을 다시 하던 중에 늦게 바뀌어도 지금 기록을 한 번 더 저장한 뒤 새로고침한다
    function finishManual() {
      if (!target || reloading || navigator.serviceWorker.controller !== target.worker) return false;
      const hw = window.__hw;
      if (hw && hw.pending) return false;
      // 13차(⑤ #14): 마지막 저장이 실패하면 새로고침하지 않는다(저장 실패 창이 뜨고, 다음 확인 때 다시)
      try { if (hw && hw.started && hw.persist && !hw.persist("update")) return false; } catch (_) { return false; }
      try { sessionStorage.setItem("hwantasy-reloaded-" + target.version, "1"); } catch (_) {}
      reloading = true;
      location.reload();
      return true;
    }

    // [지금 업데이트]: 게임이 먼저 저장한 뒤 부른다. 알린 그 버전일 때만 바꾼다
    async function manualApply() {
      if (applying || reloading || api.state !== "ready") return {ok: false, reason: "busy"};
      const worker = registration && registration.waiting;
      if (!worker) { setState("none", ""); return {ok: false, reason: "gone"}; }
      const version = api.version;
      applying = true;
      setState("applying", version);
      try {
        const result = await message(worker, "apply:" + version);
        if (!result || !result.applied) {
          setState("ready", version);
          return {ok: false, reason: (result && result.reason) || "apply-failed"};
        }
        target = {worker, version};
      } catch (_) {
        // 대답이 늦은 것은 거절이 아니다: 늦게라도 그 워커로 바뀌면 finishManual이 처리
        target = {worker, version};
      } finally { applying = false; }
      // 'applied'는 교체 요청을 받았다는 뜻 — 실제 controller가 바뀔 때까지 10초 기다린다
      for (let i = 0; i < 40 && !reloading; i++) {
        if (finishManual()) return {ok: true};
        await new Promise(resolve => setTimeout(resolve, 250));
      }
      if (reloading) return {ok: true};
      setState(registration.waiting === worker ? "ready" : "none", registration.waiting === worker ? version : "");
      return {ok: false, reason: "no-answer"};
    }

    async function update() {
      try {
        // 인터넷이 없으면 확인하지 않아요(비행기 모드에서 콘솔 오류 방지)
        if (!registration || navigator.onLine === false || performance.now() - lastUpdate < 60000) return;
        lastUpdate = performance.now();
        await registration.update();
      } catch (_) {}
      finally { await status(); await applyWaiting(); }
    }

    // 13차 [업데이트 확인]: 60초 제한 없이 바로 서버에 묻고, 새 버전을 다 받을 때까지 최대 20초 기다린다.
    // 결과 {result: ready|latest|offline|busy|error, version}. ready면 기존 [지금 업데이트] 흐름(hw-update)을 그대로 쓴다
    let checkingNow = null;
    function checkNow() {
      if (!checkingNow) checkingNow = runCheck().finally(() => { checkingNow = null; });
      return checkingNow;
    }
    async function runCheck() {
      if (!registration) return {result: "error"};
      await checkWaiting();
      if (api.state === "ready" || api.state === "applying") return {result: "ready", version: api.version};
      if (navigator.onLine === false) return {result: "offline"};
      const deadline = performance.now() + 20000;
      lastUpdate = performance.now();
      const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
      try {
        const done = await Promise.race([registration.update().then(() => true), sleep(15000).then(() => false)]);
        if (!done) return {result: "busy"};
      } catch (_) { return {result: navigator.onLine === false ? "offline" : "error"}; }
      let quietSince = performance.now();
      while (performance.now() < deadline) {
        await checkWaiting();
        if (api.state === "ready") return {result: "ready", version: api.version};
        // 받는 중도 기다리는 것도 1초 넘게 없으면 새 버전이 없는 것(⑦ #2: 시각으로 잰다)
        if (registration.installing || registration.waiting) quietSince = performance.now();
        else if (performance.now() - quietSince > 1000) return {result: "latest", version: api.current};
        await sleep(250);
      }
      return {result: "busy"};
    }

    async function controllerChanged() {
      const existed = hadController;
      hadController = !!navigator.serviceWorker.controller;
      try {
        const worker = navigator.serviceWorker.controller;
        if (finishManual()) return;
        if (existed && worker && safe() && !reloading) autoTarget = worker;
        if (autoTarget && autoTarget === worker && safe() && !reloading) {
          const data = await message(worker, "status");
          // 대답을 받았으면 다시 확인할 필요 없음(대답이 없을 때만 주기 작업이 다시 확인)
          autoTarget = null;
          if (data.ready && safe() && worker === navigator.serviceWorker.controller) {
            const key = "hwantasy-reloaded-" + data.version;
            // 같은 버전으로 두 번 새로고침하지 않게 표시한다. sessionStorage를 못 쓰면 그래도 한 번은 새로고침한다
            // (controllerchange는 버전이 바뀔 때만 오므로 무한 새로고침이 되지 않는다)
            let seen = false;
            try { seen = !!sessionStorage.getItem(key); sessionStorage.setItem(key, "1"); } catch (_) {}
            if (!seen) {
              reloading = true;
              location.reload();
              return;
            }
          }
        }
      } catch (_) {}
      if (autoTarget && (autoTarget !== navigator.serviceWorker.controller || !safe())) autoTarget = null;
      await status();
      await applyWaiting();
    }

    async function start() {
      show(PREPARING);
      try {
        if (navigator.storage && navigator.storage.persist) {
          Promise.resolve(navigator.storage.persist()).catch(() => {});
        }
      } catch (_) {}
      try {
        navigator.serviceWorker.addEventListener("controllerchange", () => { controllerChanged().catch(() => {}); });
        registration = await navigator.serviceWorker.register("./sw.js", {scope: "./", updateViaCache: "none"});
        const watch = worker => {
          try {
            if (!worker) return;
            worker.addEventListener("statechange", () => {
              status().catch(() => {});
              checkWaiting().catch(() => {});
              applyWaiting().catch(() => {});
            });
          } catch (_) {}
        };
        registration.addEventListener("updatefound", () => { watch(registration.installing); });
        watch(registration.installing);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") update().catch(() => {});
        });
        window.addEventListener("online", () => { update().catch(() => {}); });
        // Retry a deferred application when the player returns to title/select
        // or another window closes; polling never calls registration.update().
        setInterval(() => {
          if (finishManual()) return;
          if (autoTarget) { controllerChanged().catch(() => {}); return; }
          status().catch(() => {}); applyWaiting().catch(() => {}); checkWaiting().catch(() => {});
        }, 1500);
        await status();
        await applyWaiting();
        await update();
      } catch (_) { show(UNAVAILABLE); }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", () => { start().catch(() => { show(UNAVAILABLE); }); }, {once: true});
    } else { start().catch(() => { show(UNAVAILABLE); }); }
  } catch (_) {}
})();
</script>
</body>
</html>
